; ============================================================================
;  TDeckJisho – Japanese⇄English dictionary + reader for the LilyGO T-Deck
; ============================================================================
;
;  Two build environments share ONE source tree:
;
;    pio run -e native -t exec  -> the same app in an SDL window on the PC.
;                                  This is where almost all development happens.
;    pio run -e tdeck           -> .pio/build/tdeck/tdeckjisho-<version>.bin for the device.
;                                  Put it on the device
;                                  through Launcher's Wi-Fi interface (WUI) or the SD card.
;
;  NEVER run `pio run -e tdeck -t upload` on a T-Deck that runs Launcher: that is a
;  stock flash (bootloader + partition table + app) and it REPLACES Launcher.
;
;  The only code that differs between them lives in src/hal/tdeck/ and
;  src/hal/sdl/. `build_src_filter` below decides which of the two folders
;  the compiler is allowed to see. Everything else (dictionary, text engine,
;  UI) is plain C++17 and is compiled for both targets.
;
;  Run all commands from the project root (the folder with this file):
;  PlatformIO looks for platformio.ini in the current directory.
; ============================================================================

[platformio]
default_envs = native

; ----------------------------------------------------------------------------
; [env] (no name) holds settings that EVERY environment inherits.
;
; custom_name, custom_version: our own options (`custom_` is the prefix PlatformIO
;   reserves for them: it ignores them, scripts read them). The version number lives
;   ONLY here.
; extra_scripts: tools/name_firmware.py names the firmware file
;   <custom_name>-<custom_version>.bin instead of the vague firmware.bin, and
;   compiles the version into the program. `pre:` = run before the platform's own
;   build script. See docs/06-customising.md, "Version and firmware name".
; ----------------------------------------------------------------------------
[env]
custom_name = tdeckjisho
custom_version = 0.1.1
extra_scripts = pre:tools/name_firmware.py

; ----------------------------------------------------------------------------
; Settings shared by both environments. `${common.xxx}` pulls them in below.
; ----------------------------------------------------------------------------
[common]
; LovyanGFX is the graphics library. This project needs 1.3.0 or newer (1.3.0
; made pushSprite() from PSRAM asynchronous: see App::render()). PlatformIO
; downloads it into .pio/libdeps/<env>/ on the first build.
lib_deps =
    lovyan03/LovyanGFX@^1.3.0

build_flags =
    -Isrc                ; lets us write #include "core/Utf8.hpp" from anywhere
    -Wall                ; show (almost) all warnings – they catch real bugs

; ----------------------------------------------------------------------------
; Real hardware
; ----------------------------------------------------------------------------
[env:tdeck]
platform = espressif32@6.9.0          ; = Arduino-ESP32 core 2.0.17, ESP-IDF 4.4
board = esp32-s3-devkitc-1            ; closest generic board; we override below
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv   ; 6.5 MB app slot: room for CJK fonts
board_build.arduino.memory_type = qio_opi   ; T-Deck has 8 MB *octal* PSRAM
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder   ; turns crash addresses into file:line

; Getting the firmware onto the device:
;   - With Launcher (the normal way): upload .pio/build/tdeck/tdeckjisho-<version>.bin through
;     Launcher's WUI (Wi-Fi, from a browser), or copy it to the SD card and install
;     it from Launcher's SD menu.
;   - Without Launcher: `pio run -e tdeck -t upload` = normal direct flash
;     (bootloader + partition table + app). It replaces whatever is on the device,
;     Launcher included, so never do this on a device where you want to keep it.

lib_deps = ${common.lib_deps}

; HTTPS needs the root certificates to check servers against. This script turns
; tools/bundle/cacert.pem into a header before every build (docs/05-network.md). Without
; the PEM the firmware refuses https:// – it never falls back to "insecure".
; Setting extra_scripts here REPLACES the [env] list, so name_firmware.py again.
extra_scripts =
    pre:tools/name_firmware.py
    pre:tools/make_ca_bundle.py

; The Arduino core compiles with -std=gnu++11 by default. We use C++17
; features (std::string_view, if-with-initializer, structured bindings), so we
; remove the old flag and add the new one.
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -DARDUINO_USB_MODE=1          ; USB-Serial/JTAG peripheral for Serial
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB, so logs appear without a UART
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1          ; ESP-IDF log level: errors only

; Compile everything in src/ EXCEPT the PC-only folder.
build_src_filter = +<*> -<hal/sdl/>

; ----------------------------------------------------------------------------
; PC simulator (SDL2 window + libcurl for HTTP)
; Needs: libsdl2-dev, libcurl4-openssl-dev (Debian/Ubuntu package names).
; ----------------------------------------------------------------------------
[env:native]
platform = native
build_type = debug
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -std=c++17
    -DJISHO_SDL=1
    !sdl2-config --cflags         ; "!" = run this shell command, paste its output
    !sdl2-config --libs
    !curl-config --libs
    -fsanitize=address            ; AddressSanitizer: catches use-after-free,
                                  ; buffer overruns... on the PC for free.
    -lubsan                       ; the runtime of -fsanitize=undefined (below)
; UndefinedBehaviorSanitizer (overflow, misaligned access...) only for OUR code:
; build_src_flags apply to src/ but not to libraries. LovyanGFX reads unaligned
; 8-byte values in its frame-buffer code, harmless on a PC but reported on every frame.
build_src_flags = -fsanitize=undefined
build_src_filter = +<*> -<hal/tdeck/>
