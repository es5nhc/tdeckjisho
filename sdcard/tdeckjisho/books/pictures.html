<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>絵 HTML pictures</title></head>
<body>
<h1>HTML pictures</h1>
<p>Local HTML files show their <code>&lt;img&gt;</code> pictures too. The
<code>alt</code> text becomes the caption.</p>
<img src="img/korewapendesu.bmp" alt="That famous phrase in BMP">
<p>Web pages (opened through the Web menu) still show only the alt text in
brackets: every picture would be another download and more RAM.</p>
<figure>
  <img src="img/sakura.jpg" alt="Sakura in Tartu">
  <figcaption>&lt;figcaption&gt; is shown as a normal paragraph below.</figcaption>
</figure>
</body>
</html>
